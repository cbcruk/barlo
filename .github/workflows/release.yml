name: Release

# Publishes whatever tag was pushed, so the version in package.json must match
# the tag. Authentication is npm trusted publishing over OIDC: npm mints a
# short-lived credential for this workflow at publish time, so there is no
# long-lived token to leak or to rotate. The trusted publisher registered on
# npmjs.com names this file, so renaming it stops publishing until that entry
# is updated to match.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Lets GitHub mint the OIDC token that npm exchanges for publish rights.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC publishing needs npm 11.5.1 or later, newer than some Node 24
      # releases bundle.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@latest

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run docs:check
      - run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm test

      # `prepack` runs the build, so dist/ is produced here. npm
      # also attaches a provenance attestation on its own when publishing this
      # way; `--provenance` is not needed and the repository has to stay public
      # for it to work.
      - name: Publish
        run: npm publish --access public
